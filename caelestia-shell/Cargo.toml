[workspace]
resolver = "3"
members = [
    ".",
    "engine/crates/bench_metrics",
    "engine/crates/collections",
    "engine/crates/gpui",
    "engine/crates/gpui_linux",
    "engine/crates/gpui_macros",
    "engine/crates/gpui_shared_string",
    "engine/crates/gpui_util",
    "engine/crates/gpui_wgpu",
    "engine/crates/http_client",
    "engine/crates/path",
    "engine/crates/perf",
    "engine/crates/refineable",
    "engine/crates/refineable/derive_refineable",
    "engine/crates/scheduler",
    "engine/crates/sum_tree",
    "engine/crates/util",
    "engine/crates/util_macros",
    "engine/crates/zlog",
    "engine/crates/ztracing",
    "engine/crates/ztracing_macro",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[workspace.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_unix = "0.22"
anyhow = "1.0.86"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit", "open_uri", "file_chooser", "settings"] }
async-channel = { version = "2.5", default-features = false }
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-fs = "2.1"
async-tar = { git = "https://github.com/zed-industries/async-tar", rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0" }
async-task = "4.7"
async-tungstenite = "0.33"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
backtrace = "0.3"
bench_metrics = { path = "engine/crates/bench_metrics" }
bitflags = "2.6.0"
bytemuck = "1"
bytes = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
collections = { path = "engine/crates/collections", version = "0.1.0" }
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.12"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
derive_refineable = { path = "engine/crates/refineable/derive_refineable" }
dirs = "6.0"
dunce = "1.0"
env_logger = "0.11"
etagere = "0.2"
flume = { version = "0.12", default-features = false, features = ["async"] }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
futures = "0.3.34"
futures-concurrency = "7.7.1"
futures-lite = "2"
globset = "0.4"
gpui = { path = "engine/crates/gpui", default-features = false }
gpui_linux = { path = "engine/crates/gpui_linux", default-features = false, features = ["wayland"] }
gpui_macros = { path = "engine/crates/gpui_macros" }
gpui_shared_string = { path = "engine/crates/gpui_shared_string" }
gpui_util = { path = "engine/crates/gpui_util" }
gpui_wgpu = { path = "engine/crates/gpui_wgpu" }
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
heck = "0.5"
http = "1.1"
http-body = "1.0"
http_client = { path = "engine/crates/http_client" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
indexmap = { version = "2.7.0", features = ["serde"] }
inventory = "0.3.19"
itertools = "0.14.0"
js-sys = "0.3"
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
mach2 = "0.6"
nix = "0.30"
notify-rust = "4"
objc2 = "0.6"
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer"] }
oo7 = { git = "https://github.com/zed-industries/oo7", rev = "731c1215edb6905876c6137ab300428c7b8d7c13", version = "0.6", default-features = false }
parking_lot = "0.12.1"
path = { path = "engine/crates/path" }
percent-encoding = "2.3.2"
perf = { path = "engine/crates/perf", default-features = false }
perf-event = { package = "perf-event2", version = "0.7.4" }
pollster = "0.4.0"
postage = { version = "0.5", default-features = false }
proc-macro2 = "1.0.93"
profiling = "1"
proptest = { version = "1.12.0", features = ["attr-macro"] }
quote = "1.0.9"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = "0.6"
rayon = "1.8"
refineable = { path = "engine/crates/refineable" }
regex = { version = "1.5", default-features = false, features = ["std", "perf"] }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
rust-embed = { version = "8.11", features = ["include-exclude", "compression"] }
rustc-hash = "2.1.0"
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
scheduler = { path = "engine/crates/scheduler" }
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
shlex = "2.0"
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
sum_tree = { path = "engine/crates/sum_tree" }
swash = "0.2.6"
syn = { version = "2.0", default-features = false, features = ["proc-macro"] }
taffy = { version = "=0.15.0", default-features = false }
tempfile = "3.20.0"
tendril = "0.5"
thiserror = "2.0.12"
tracing = "0.1.40"
tracing-subscriber = "0.3"
unicase = "2.6"
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-segmentation = "1.10"
url = "2.2"
usvg = { version = "0.46.0", default-features = false }
util = { path = "engine/crates/util" }
util_macros = { path = "engine/crates/util_macros" }
uuid = { version = "1.1", features = ["serde"] }
walkdir = "2.5"
wasm-bindgen = "0.2.120"
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = ["es_modules"] }
web-sys = "0.3"
web-time = "1.1.0"
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "3b3506ea31154edc04de64debda0e780cba2639c", default-features = false }
which = "8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
xkbcommon = { version = "0.8", default-features = false }
zlog = { path = "engine/crates/zlog" }
ztracing = { path = "engine/crates/ztracing" }
ztracing_macro = { path = "engine/crates/ztracing_macro" }

[package]
name = "caelestia-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "GPU-accelerated modular desktop shell for Caelestia KDE"

[dependencies]
gpui = { workspace = true, features = ["wayland"] }
gpui_linux = { workspace = true, features = ["wayland"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow.workspace = true
chrono = "0.4"
sysinfo = "0.31"
sha2.workspace = true
percent-encoding.workspace = true
regex.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
